<!DOCTYPE html>
<html>
<head>
  <title>Mostrar Dato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Esto escribiste:</h2>
  <p id="resultado">Cargando...</p>

  <a href="index.html">Volver a escribir</a>

  <script src="mostrar.js"></script>
</body>
</html>
<!-- Firebase scripts igual que antes -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  const firebaseConfig = { /* tu config otra vez */ };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  db.ref("datos").limitToLast(1).on("value", (snapshot) => {
    const contenedor = document.getElementById("resultado");
    contenedor.innerHTML = "";
    snapshot.forEach((dato) => {
      contenedor.innerHTML = `<p>${dato.val().mensaje}</p>`;
    });
  });
</script>

<h2>Último mensaje guardado:</h2>
<div id="resultado">Cargando...</div>
