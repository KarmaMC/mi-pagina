<!-- Firebase scripts igual que antes -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
   const firebaseConfig = { 
  apiKey: "AIzaSyCA49k7Ixs0tZ0NuObYHU5zVipzIfnvOPM",
  authDomain: "mi-pagina-40283.firebaseapp.com",
  databaseURL: "https://mi-pagina-40283-default-rtdb.firebaseio.com",
  projectId: "mi-pagina-40283",
  storageBucket: "mi-pagina-40283.firebasestorage.app",
  messagingSenderId: "137375923688",
  appId: "1:137375923688:web:116ca462745d43f0f6385d", };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  db.ref("datos").limitToLast(1).on("value", (snapshot) => {
    const contenedor = document.getElementById("resultado");
    contenedor.innerHTML = "";
    snapshot.forEach((dato) => {
      contenedor.innerHTML = `<p>${dato.val().mensaje}</p>`;
    });
  });
</script>

<h2>Último mensaje guardado:</h2>
<div id="resultado">Cargando...</div>
